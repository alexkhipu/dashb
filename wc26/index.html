<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pronóstico Mundial 2026</title>
<style>
  :root {
    --bg: #0a1628;
    --panel: #13243d;
    --panel2: #1a2d4a;
    --gold: #FFD700;
    --gold-dim: #b89c00;
    --red: #FF6B7A;
    --green: #7BD957;
    --purple: #C39BF0;
    --white: #FFFFFF;
    --muted: #8AA0B5;
    --border: #2a3f5f;
    --ecu: #FFDD00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body {
    padding-bottom: 80px;
    max-width: 720px;
    margin: 0 auto;
    background: linear-gradient(180deg, #081224 0%, var(--bg) 100%);
    min-height: 100vh;
  }

  /* Header */
  .app-header {
    background: var(--panel);
    border-bottom: 3px solid var(--gold);
    padding: 14px 16px 10px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .app-header h1 {
    color: var(--gold);
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1.5px;
  }
  .app-header .sub {
    color: var(--muted);
    font-size: 11px;
    margin-top: 3px;
    letter-spacing: 0.5px;
  }

  /* Tabs */
  .tabs {
    background: var(--panel);
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: 64px;
    z-index: 99;
    border-bottom: 1px solid var(--border);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    padding: 14px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    letter-spacing: 0.5px;
    transition: all 0.2s;
    flex: 1;
    min-width: max-content;
  }
  .tab-btn:hover { color: var(--white); }
  .tab-btn.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }
  .tab-btn .count {
    display: inline-block;
    background: var(--border);
    color: var(--white);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
    margin-left: 4px;
    font-weight: 800;
  }
  .tab-btn.active .count {
    background: var(--gold);
    color: var(--bg);
  }

  /* Tab Content */
  .tab-content { display: none; padding: 12px; }
  .tab-content.active { display: block; }

  /* Group Card */
  .group-card {
    background: var(--panel);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .group-header {
    background: var(--panel2);
    padding: 10px 14px;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 1.5px;
    color: var(--gold);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .group-header .group-letter {
    background: var(--gold);
    color: var(--bg);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 13px;
    margin-right: 8px;
  }
  .group-header .teams-list {
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* Match Row */
  .match {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .match:last-child { border-bottom: none; }
  .match.ecu { background: rgba(255, 215, 0, 0.08); }
  .match .date-time {
    flex-shrink: 0;
    width: 58px;
    text-align: center;
  }
  .match .date {
    font-size: 10px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .match .time {
    font-size: 12px;
    color: var(--white);
    font-weight: 700;
    margin-top: 2px;
  }
  .match .teams {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .team {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }
  .team.away { justify-content: flex-end; text-align: right; }
  .team-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .team-code {
    font-size: 14px;
    font-weight: 800;
    color: var(--white);
  }
  .ecu .team-code, .ecu .team-name { color: var(--gold); }
  .score-input {
    width: 30px;
    height: 30px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--white);
    text-align: center;
    font-size: 14px;
    font-weight: 800;
    border-radius: 5px;
    -moz-appearance: textfield;
  }
  .score-input::-webkit-outer-spin-button,
  .score-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .score-input:focus {
    outline: none;
    border-color: var(--gold);
    background: rgba(255, 215, 0, 0.08);
  }
  .score-input.filled {
    border-color: var(--gold-dim);
    color: var(--gold);
  }
  .vs {
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
  }
  .venue {
    font-size: 9px;
    color: var(--muted);
    margin-top: 2px;
    text-align: right;
    width: 50px;
    flex-shrink: 0;
  }

  /* Standings Table */
  .standings {
    padding: 10px 12px;
    background: rgba(0,0,0,0.2);
  }
  .standings-title {
    font-size: 10px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: 1.5px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .standings-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }
  .standings-table th {
    text-align: center;
    color: var(--muted);
    font-weight: 700;
    padding: 5px 3px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
  }
  .standings-table th:first-child { text-align: left; }
  .standings-table td {
    text-align: center;
    padding: 6px 3px;
    color: var(--white);
    font-weight: 600;
    font-size: 12px;
  }
  .standings-table td:first-child {
    text-align: left;
    font-weight: 700;
  }
  .standings-table tr.pos-1 td:first-child { color: var(--green); }
  .standings-table tr.pos-2 td:first-child { color: #FFB84D; }
  .standings-table tr.pos-3 td:first-child { color: var(--purple); }
  .standings-table tr.pos-4 td:first-child { color: var(--muted); }
  .standings-table td.points {
    font-weight: 900;
    color: var(--gold);
  }
  .standings-table tr.ecu-row td {
    background: rgba(255, 215, 0, 0.1);
  }
  .standings-table tr.ecu-row td:first-child {
    color: var(--ecu);
    font-weight: 900;
  }

  /* Round headers */
  .round-header {
    background: linear-gradient(135deg, var(--panel) 0%, var(--panel2) 100%);
    padding: 14px 16px;
    border-radius: 8px;
    margin-bottom: 12px;
    border-left: 4px solid var(--purple);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .round-header h2 {
    color: var(--purple);
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1.5px;
  }
  .round-header .meta {
    color: var(--muted);
    font-size: 11px;
  }

  /* Knockout match */
  .ko-match {
    background: var(--panel);
    border-radius: 8px;
    margin-bottom: 10px;
    padding: 12px;
    border-left: 4px solid var(--purple);
    position: relative;
  }
  .ko-match.ecu { border-left-color: var(--gold); background: rgba(255, 215, 0, 0.05); }
  .ko-match-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 11px;
    color: var(--muted);
    font-weight: 700;
  }
  .ko-match-header .id {
    background: var(--purple);
    color: var(--bg);
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: 800;
    font-size: 10px;
  }
  .ko-match.ecu .ko-match-header .id { background: var(--gold); }

  .ko-pairing {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: center;
  }
  .ko-side {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .ko-side.away { text-align: right; }
  .ko-side .team-name { font-size: 13px; }
  .ko-side .slot-label {
    font-size: 10px;
    color: var(--muted);
    font-style: italic;
  }
  .ko-scores {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .ko-vs { color: var(--muted); font-size: 11px; font-weight: 700; }

  /* Generic slot label for unresolved teams */
  .slot-label {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    font-weight: 600;
  }
  /* Winner highlight on team in match row */
  .match .team.winner .team-code,
  .match .team.winner .team-name {
    color: var(--gold);
  }
  .match .team.winner .team-code::after {
    content: ' ✓';
    color: var(--gold);
    font-size: 11px;
  }
  /* Final round card — gold themed */
  .group-card.final-round {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold);
  }
  .group-card.final-round .group-header {
    background: linear-gradient(135deg, var(--panel2) 0%, rgba(255,215,0,0.15) 100%);
    color: var(--gold);
  }
  .group-card.final-round .group-letter {
    background: var(--gold);
    color: var(--bg);
  }
  /* Champion banner standalone */
  .champion-standalone {
    margin: 12px 0 0;
    padding: 16px;
    background: linear-gradient(135deg, var(--gold) 0%, #FFA500 100%);
    color: var(--bg);
    border-radius: 8px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-align: center;
  }
  .winner-indicator {
    display: inline-block;
    width: 0;
    height: 0;
    border-left: 6px solid var(--gold);
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    margin-left: 4px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .ko-side.winner .winner-indicator { opacity: 1; }
  .ko-side.winner .team-name, .ko-side.winner .team-code { color: var(--gold); }
  .ko-third-pick {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--white);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    width: 100%;
    max-width: 140px;
  }

  /* Cronograma (schedule view) */
  .crono-section {
    margin-bottom: 20px;
  }
  .crono-section-header {
    background: var(--panel2);
    padding: 12px 14px;
    border-radius: 8px 8px 0 0;
    border-left: 5px solid var(--gold);
    margin-bottom: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .crono-section-header.elim { border-left-color: var(--purple); }
  .crono-section-header h2 {
    color: var(--gold);
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1.5px;
  }
  .crono-section-header.elim h2 { color: var(--purple); }
  .crono-section-header .meta {
    color: var(--muted);
    font-size: 11px;
  }
  .crono-row {
    display: flex;
    align-items: stretch;
    background: var(--panel);
    border-left: 3px solid var(--border);
    margin-bottom: 1px;
    min-height: 56px;
  }
  .crono-date {
    background: rgba(0,0,0,0.25);
    padding: 8px 10px;
    width: 76px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 4px 0 0 4px;
  }
  .crono-date .day-num {
    color: var(--white);
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
  }
  .crono-date .day-name {
    color: var(--white);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .crono-matches {
    flex: 1;
    padding: 8px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    align-items: center;
  }
  .crono-m {
    font-size: 13px;
    font-weight: 700;
    color: var(--white);
    white-space: nowrap;
  }
  .crono-m.ecu { color: var(--gold); }
  .crono-m.marq { color: var(--red); }
  .crono-m.opener { color: var(--green); }
  .crono-m .sep {
    color: var(--muted);
    margin-right: 4px;
    font-weight: 900;
  }
  .crono-final {
    background: linear-gradient(135deg, var(--panel) 0%, rgba(255, 215, 0, 0.15) 100%);
    border: 2px solid var(--gold);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    margin-top: 8px;
  }
  .crono-final .title {
    color: var(--gold);
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .crono-final .when {
    color: var(--white);
    font-size: 13px;
    font-weight: 600;
  }
  .crono-legend {
    background: var(--panel);
    padding: 10px 12px;
    border-radius: 6px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 14px;
  }
  .crono-legend .ecu-l { color: var(--gold); font-weight: 700; }
  .crono-legend .marq-l { color: var(--red); font-weight: 700; }
  .crono-legend .open-l { color: var(--green); font-weight: 700; }

  /* Final card */
  .final-card {
    background: linear-gradient(135deg, var(--panel) 0%, rgba(255, 215, 0, 0.1) 100%);
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .final-card h2 {
    color: var(--gold);
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 4px;
  }
  .final-card .when {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 14px;
  }
  .final-card .ko-pairing { margin-bottom: 6px; }
  .champion-banner {
    margin-top: 16px;
    padding: 14px;
    background: linear-gradient(135deg, var(--gold) 0%, #FFA500 100%);
    color: var(--bg);
    border-radius: 8px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
    display: none;
  }
  .champion-banner.shown { display: block; }

  /* Progress indicator */
  .progress {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin: 8px 0 16px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green) 0%, var(--gold) 100%);
    transition: width 0.3s;
  }

  /* Reset button */
  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    margin: 0 auto 16px;
    display: block;
  }
  .reset-btn:hover {
    border-color: var(--red);
    color: var(--red);
  }

  /* Empty/locked state */
  .locked-msg {
    background: var(--panel);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
  }

  /* Save indicator */
  .save-indicator {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--green);
    color: var(--bg);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 200;
  }
  .save-indicator.shown { opacity: 1; }

  @media (max-width: 400px) {
    .team-name { font-size: 11px; }
    .team-code { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="app-header">
  <h1>🏆 PRONÓSTICO MUNDIAL 2026 🇪🇨</h1>
  <div class="sub">Ingresa resultados · Predice el campeón</div>
</div>

<nav class="tabs" id="tabs">
  <button class="tab-btn active" data-tab="cronograma">📅 Cronograma</button>
  <button class="tab-btn" data-tab="grupos">Grupos<span class="count" id="count-grupos">0/72</span></button>
  <button class="tab-btn" data-tab="r32">R32<span class="count" id="count-r32">0/16</span></button>
  <button class="tab-btn" data-tab="r16">R16<span class="count" id="count-r16">0/8</span></button>
  <button class="tab-btn" data-tab="cuartos">Cuartos<span class="count" id="count-cuartos">0/4</span></button>
  <button class="tab-btn" data-tab="semis">Semis<span class="count" id="count-semis">0/2</span></button>
  <button class="tab-btn" data-tab="final">Final</button>
</nav>

<div id="tab-cronograma" class="tab-content active"></div>
<div id="tab-grupos" class="tab-content"></div>
<div id="tab-r32" class="tab-content"></div>
<div id="tab-r16" class="tab-content"></div>
<div id="tab-cuartos" class="tab-content"></div>
<div id="tab-semis" class="tab-content"></div>
<div id="tab-final" class="tab-content"></div>

<div class="save-indicator" id="saveIndicator">✓ Guardado</div>

<script>
// ============= DATA =============
const TEAMS = {
  MEX:{n:'México',f:'🇲🇽'}, RSA:{n:'Sudáfrica',f:'🇿🇦'}, KOR:{n:'Corea del Sur',f:'🇰🇷'}, CZE:{n:'Chequia',f:'🇨🇿'},
  CAN:{n:'Canadá',f:'🇨🇦'}, BIH:{n:'Bosnia',f:'🇧🇦'}, QAT:{n:'Qatar',f:'🇶🇦'}, SUI:{n:'Suiza',f:'🇨🇭'},
  BRA:{n:'Brasil',f:'🇧🇷'}, MAR:{n:'Marruecos',f:'🇲🇦'}, HAI:{n:'Haití',f:'🇭🇹'}, SCO:{n:'Escocia',f:'🏴󠁧󠁢󠁳󠁣󠁴󠁿'},
  USA:{n:'EE.UU.',f:'🇺🇸'}, PAR:{n:'Paraguay',f:'🇵🇾'}, AUS:{n:'Australia',f:'🇦🇺'}, TUR:{n:'Türkiye',f:'🇹🇷'},
  GER:{n:'Alemania',f:'🇩🇪'}, CUW:{n:'Curazao',f:'🇨🇼'}, CIV:{n:'Costa de Marfil',f:'🇨🇮'}, ECU:{n:'Ecuador',f:'🇪🇨'},
  NED:{n:'Países Bajos',f:'🇳🇱'}, JPN:{n:'Japón',f:'🇯🇵'}, SWE:{n:'Suecia',f:'🇸🇪'}, TUN:{n:'Túnez',f:'🇹🇳'},
  BEL:{n:'Bélgica',f:'🇧🇪'}, EGY:{n:'Egipto',f:'🇪🇬'}, IRN:{n:'Irán',f:'🇮🇷'}, NZL:{n:'Nueva Zelanda',f:'🇳🇿'},
  ESP:{n:'España',f:'🇪🇸'}, CPV:{n:'Cabo Verde',f:'🇨🇻'}, KSA:{n:'Arabia Saudí',f:'🇸🇦'}, URU:{n:'Uruguay',f:'🇺🇾'},
  FRA:{n:'Francia',f:'🇫🇷'}, SEN:{n:'Senegal',f:'🇸🇳'}, IRQ:{n:'Irak',f:'🇮🇶'}, NOR:{n:'Noruega',f:'🇳🇴'},
  ARG:{n:'Argentina',f:'🇦🇷'}, ALG:{n:'Argelia',f:'🇩🇿'}, AUT:{n:'Austria',f:'🇦🇹'}, JOR:{n:'Jordania',f:'🇯🇴'},
  POR:{n:'Portugal',f:'🇵🇹'}, COD:{n:'Congo DR',f:'🇨🇩'}, UZB:{n:'Uzbekistán',f:'🇺🇿'}, COL:{n:'Colombia',f:'🇨🇴'},
  ENG:{n:'Inglaterra',f:'🏴󠁧󠁢󠁥󠁮󠁧󠁿'}, GHA:{n:'Ghana',f:'🇬🇭'}, PAN:{n:'Panamá',f:'🇵🇦'}, CRO:{n:'Croacia',f:'🇭🇷'}
};

const GROUPS = {
  A:['MEX','RSA','KOR','CZE'], B:['CAN','BIH','QAT','SUI'],
  C:['BRA','MAR','HAI','SCO'], D:['USA','PAR','AUS','TUR'],
  E:['GER','CUW','CIV','ECU'], F:['NED','JPN','SWE','TUN'],
  G:['BEL','EGY','IRN','NZL'], H:['ESP','CPV','KSA','URU'],
  I:['FRA','SEN','IRQ','NOR'], J:['ARG','ALG','AUT','JOR'],
  K:['POR','COD','UZB','COL'], L:['ENG','GHA','PAN','CRO']
};

// ============= LOGIC =============
function calculateStandings(groupId) {
  const teams = GROUPS[groupId];
  const table = teams.map(t => ({code: t, pts: 0, gp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0}));
  const byCode = Object.fromEntries(table.map(t => [t.code, t]));

  MATCHES.forEach((m, idx) => {
    if (m[4] !== groupId) return;
    const score = state.scores[idx];
    if (!score || score[0] == null || score[1] == null) return;
    const [hs, as] = score;
    const h = byCode[m[2]], a = byCode[m[3]];
    h.gp++; a.gp++;
    h.gf += hs; h.ga += as;
    a.gf += as; a.ga += hs;
    if (hs > as) { h.w++; h.pts += 3; a.l++; }
    else if (hs < as) { a.w++; a.pts += 3; h.l++; }
    else { h.d++; a.d++; h.pts += 1; a.pts += 1; }
  });

  table.sort((x, y) => {
    if (y.pts !== x.pts) return y.pts - x.pts;
    const xgd = x.gf - x.ga, ygd = y.gf - y.ga;
    if (ygd !== xgd) return ygd - xgd;
    return y.gf - x.gf;
  });
  return table;
}

function isGroupComplete(groupId) {
  const matchIdxs = [];
  MATCHES.forEach((m, i) => { if (m[4] === groupId) matchIdxs.push(i); });
  return matchIdxs.every(i => state.scores[i] && state.scores[i][0] != null && state.scores[i][1] != null);
}

function getPosition(groupId, pos) {
  if (!isGroupComplete(groupId)) return null;
  const standings = calculateStandings(groupId);
  return standings[pos - 1]?.code;
}

function getThirdPlaceRanked() {
  // Get all 12 third-place teams ranked, return top 8
  const thirds = Object.keys(GROUPS).map(g => {
    if (!isGroupComplete(g)) return null;
    const standings = calculateStandings(g);
    return {group: g, ...standings[2]};
  }).filter(Boolean);
  thirds.sort((x, y) => {
    if (y.pts !== x.pts) return y.pts - x.pts;
    const xgd = x.gf - x.ga, ygd = y.gf - y.ga;
    if (ygd !== xgd) return ygd - xgd;
    return y.gf - x.gf;
  });
  return thirds;
}

function getBest3ForSlot(fromGroups) {
  // Returns first eligible 3rd-place team from the slot's allowed groups
  if (Object.keys(GROUPS).some(g => !isGroupComplete(g))) return null;
  const eligible = fromGroups.split('').filter(g => Object.keys(GROUPS).includes(g));
  const ranked = getThirdPlaceRanked();
  // Take top 8
  const advancing = ranked.slice(0, 8).map(r => r.group);
  // Find first one in this slot's eligible set that's advancing
  for (const g of eligible) {
    if (advancing.includes(g)) return getPosition(g, 3);
  }
  return null;
}

function resolveSide(side, koMatchId) {
  if (side.t === 'pos') return getPosition(side.g, side.p);
  if (side.t === 'best3') {
    const manual = state.third[koMatchId + '_' + side.from];
    if (manual) return manual;
    return getBest3ForSlot(side.from);
  }
  if (side.t === 'winner') {
    const scores = state.ko[side.m];
    const ko = KO.find(k => k.id === side.m);
    if (!scores || scores[0] == null || scores[1] == null || !ko) return null;
    if (scores[0] === scores[1]) return null; // need a winner; ties not allowed in knockouts
    const h = resolveSide(ko.h, ko.id);
    const a = resolveSide(ko.a, ko.id);
    return scores[0] > scores[1] ? h : a;
  }
  if (side.t === 'loser') {
    const scores = state.ko[side.m];
    const ko = KO.find(k => k.id === side.m);
    if (!scores || scores[0] == null || scores[1] == null || !ko) return null;
    if (scores[0] === scores[1]) return null;
    const h = resolveSide(ko.h, ko.id);
    const a = resolveSide(ko.a, ko.id);
    return scores[0] < scores[1] ? h : a;
  }
  return null;
}

function sideLabel(side) {
  if (side.t === 'pos') return `${side.p}° ${side.g}`;
  if (side.t === 'best3') return `Mejor 3° (${side.from})`;
  if (side.t === 'winner') return `Ganador M${side.m}`;
  if (side.t === 'loser') return `Perdedor M${side.m}`;
  return '?';
}

      const isEcu = ha === 'ECU' || aw === 'ECU';
      html += `<div class="match ${isEcu ? 'ecu' : ''}">`;
      html += `<div class="date-time"><div class="date">${date.split(' ')[0]}</div><div class="time">${time}</div></div>`;
      html += `<div class="teams">`;
      html += `<div class="team"><span class="team-code">${TEAMS[ha].f} ${ha}</span></div>`;
      html += `<div class="ko-scores">`;
      html += `<input type="number" min="0" max="20" class="score-input ${score[0]!=null?'filled':''}" data-match="${idx}" data-side="h" value="${score[0]!=null?score[0]:''}" inputmode="numeric">`;
      html += `<span class="vs">-</span>`;
      html += `<input type="number" min="0" max="20" class="score-input ${score[1]!=null?'filled':''}" data-match="${idx}" data-side="a" value="${score[1]!=null?score[1]:''}" inputmode="numeric">`;
      html += `</div>`;
      html += `<div class="team away"><span class="team-code">${aw} ${TEAMS[aw].f}</span></div>`;
      html += `</div>`;
      html += `<div class="venue">${venue}</div>`;
      html += `</div>`;
    });

    // Standings
    const standings = calculateStandings(g);
    html += `<div class="standings">`;
    html += `<div class="standings-title">Tabla del grupo</div>`;
    html += `<table class="standings-table">`;
    html += `<tr><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr>`;
    standings.forEach((t, i) => {
      const isEcu = t.code === 'ECU';
      html += `<tr class="pos-${i+1} ${isEcu?'ecu-row':''}">`;
      html += `<td>${i+1}. ${TEAMS[t.code].f} ${t.code}</td>`;
      html += `<td>${t.gp}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>`;
      html += `<td>${t.gf}</td><td>${t.ga}</td><td>${t.gf - t.ga >= 0 ? '+' : ''}${t.gf - t.ga}</td>`;
      html += `<td class="points">${t.pts}</td>`;
      html += `</tr>`;
    });
    html += `</table></div>`;
    html += `</div>`;
  });

  container.innerHTML = html;

  // Bind score inputs
  container.querySelectorAll('.score-input').forEach(input => {
    input.addEventListener('input', (e) => {
      const idx = parseInt(e.target.dataset.match);
      const side = e.target.dataset.side;
      const val = e.target.value === '' ? null : parseInt(e.target.value);
      if (!state.scores[idx]) state.scores[idx] = [null, null];
      state.scores[idx][side === 'h' ? 0 : 1] = val;
      e.target.classList.toggle('filled', val !== null);
      updateProgress();
      debouncedSave();
      // Re-render standings for this group only
      const groupId = MATCHES[idx][4];
      const card = e.target.closest('.group-card');
      if (card) {
        const tbody = card.querySelector('.standings-table');
        const standings = calculateStandings(groupId);
        tbody.innerHTML = `<tr><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr>` +
          standings.map((t, i) => {
            const isEcu = t.code === 'ECU';
            return `<tr class="pos-${i+1} ${isEcu?'ecu-row':''}">` +
              `<td>${i+1}. ${TEAMS[t.code].f} ${t.code}</td>` +
              `<td>${t.gp}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>` +
              `<td>${t.gf}</td><td>${t.ga}</td><td>${t.gf - t.ga >= 0 ? '+' : ''}${t.gf - t.ga}</td>` +
              `<td class="points">${t.pts}</td></tr>`;
          }).join('');
      }
    });
  });

  updateProgress();
}

function renderKO(round) {
  const containerId = round === 'R32' ? 'r32' : round === 'R16' ? 'r16' : round === 'QF' ? 'cuartos' : round === 'SF' ? 'semis' : 'final';
  const container = document.getElementById('tab-' + containerId);

  let html = '';

  if (round === 'final') {
    // Two separate cards: 3rd place + Final
    const thirdMatch = KO.find(k => k.id === 103);
    const finalMatch = KO.find(k => k.id === 104);

    html += renderRoundCard('3°', 'TERCER PUESTO', 'Sáb 18 jul · Miami', [thirdMatch], false);
    html += renderRoundCard('🏆', 'FINAL', 'Dom 19 jul · 3 PM · MetLife NJ', [finalMatch], true);

    // Champion banner
    const score = state.ko[104] || [null, null];
    const homeCode = resolveSide(finalMatch.h, finalMatch.id);
    const awayCode = resolveSide(finalMatch.a, finalMatch.id);
    const hWin = score[0] != null && score[1] != null && score[0] > score[1];
    const aWin = score[0] != null && score[1] != null && score[0] < score[1];
    const champion = (hWin || aWin) ? (hWin ? homeCode : awayCode) : null;
    if (champion) {
      html += `<div class="champion-standalone">🏆 CAMPEÓN: ${TEAMS[champion].f} ${TEAMS[champion].n.toUpperCase()} 🏆</div>`;
    }
  } else {
    const matches = KO.filter(k => k.r === round);
    const config = {
      R32: { tag: 'R32', title: 'DIECISEISAVOS', meta: '16 partidos · 28 jun — 3 jul' },
      R16: { tag: 'R16', title: 'OCTAVOS', meta: '8 partidos · 4 — 7 jul' },
      QF: { tag: 'QF', title: 'CUARTOS DE FINAL', meta: '4 partidos · 9 — 11 jul' },
      SF: { tag: 'SF', title: 'SEMIFINALES', meta: '2 partidos · 14 — 15 jul' },
    };
    const c = config[round];
    html += renderRoundCard(c.tag, c.title, c.meta, matches, false);
  }

  container.innerHTML = html;
  bindKOInputs(container);
}

function renderRoundCard(tag, title, meta, matches, isFinal) {
  let html = `<div class="group-card ${isFinal ? 'final-round' : ''}">`;
  html += `<div class="group-header">`;
  html += `<div><span class="group-letter">${tag}</span>${title}</div>`;
  html += `<div class="teams-list">${meta}</div>`;
  html += `</div>`;
  matches.forEach(m => { html += renderKOMatchRow(m); });
  html += `</div>`;
  return html;
}

function renderKOMatchRow(m) {
  const homeCode = resolveSide(m.h, m.id);
  const awayCode = resolveSide(m.a, m.id);
  const score = state.ko[m.id] || [null, null];
  const canScore = homeCode && awayCode;
  const hWin = score[0] != null && score[1] != null && score[0] > score[1];
  const aWin = score[0] != null && score[1] != null && score[0] < score[1];

  const homeContent = homeCode
    ? `<span class="team-code">${TEAMS[homeCode].f} ${homeCode}</span>`
    : `<span class="slot-label">${sideLabel(m.h)}</span>`;
  const awayContent = awayCode
    ? `<span class="team-code">${awayCode} ${TEAMS[awayCode].f}</span>`
    : `<span class="slot-label">${sideLabel(m.a)}</span>`;

  const dayNum = m.d.split(' ')[0];

  return `<div class="match ${m.ecu ? 'ecu' : ''}">
    <div class="date-time"><div class="date">${dayNum}</div><div class="time">${m.t}</div></div>
    <div class="teams">
      <div class="team ${hWin ? 'winner' : ''}">${homeContent}</div>
      <div class="ko-scores">
        <input type="number" min="0" max="20" class="score-input ${score[0]!=null?'filled':''}" data-ko="${m.id}" data-side="h" value="${score[0]!=null?score[0]:''}" ${!canScore?'disabled':''} inputmode="numeric">
        <span class="vs">-</span>
        <input type="number" min="0" max="20" class="score-input ${score[1]!=null?'filled':''}" data-ko="${m.id}" data-side="a" value="${score[1]!=null?score[1]:''}" ${!canScore?'disabled':''} inputmode="numeric">
      </div>
      <div class="team away ${aWin ? 'winner' : ''}">${awayContent}</div>
    </div>
    <div class="venue">${m.v}</div>
  </div>`;
}

function bindKOInputs(container) {
  container.querySelectorAll('.score-input').forEach(input => {
    input.addEventListener('input', (e) => {
      const koId = parseInt(e.target.dataset.ko);
      const side = e.target.dataset.side;
      const val = e.target.value === '' ? null : parseInt(e.target.value);
      if (!state.ko[koId]) state.ko[koId] = [null, null];
      state.ko[koId][side === 'h' ? 0 : 1] = val;
      e.target.classList.toggle('filled', val !== null);
      updateProgress();
      debouncedSave();
      renderAllKO();
    });
  });
}

function renderAllKO() {
  renderKO('R32');
  renderKO('R16');
  renderKO('QF');
  renderKO('SF');
  renderKO('final');
}

function updateProgress() {
  const grupoCount = Object.values(state.scores).filter(s => s && s[0] != null && s[1] != null).length;
  document.getElementById('count-grupos').textContent = `${grupoCount}/72`;
  document.getElementById('progress-grupos').style.width = (grupoCount / 72 * 100) + '%';

  const ko = state.ko;
  const r32Count = KO.filter(k => k.r === 'R32' && ko[k.id] && ko[k.id][0] != null && ko[k.id][1] != null && ko[k.id][0] !== ko[k.id][1]).length;
  const r16Count = KO.filter(k => k.r === 'R16' && ko[k.id] && ko[k.id][0] != null && ko[k.id][1] != null && ko[k.id][0] !== ko[k.id][1]).length;
  const qfCount = KO.filter(k => k.r === 'QF' && ko[k.id] && ko[k.id][0] != null && ko[k.id][1] != null && ko[k.id][0] !== ko[k.id][1]).length;
  const sfCount = KO.filter(k => k.r === 'SF' && ko[k.id] && ko[k.id][0] != null && ko[k.id][1] != null && ko[k.id][0] !== ko[k.id][1]).length;
  document.getElementById('count-r32').textContent = `${r32Count}/16`;
  document.getElementById('count-r16').textContent = `${r16Count}/8`;
  document.getElementById('count-cuartos').textContent = `${qfCount}/4`;
  document.getElementById('count-semis').textContent = `${sfCount}/2`;
}

// ============= TABS =============
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  const tab = btn.dataset.tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + tab));
  if (tab === 'r32' || tab === 'r16' || tab === 'cuartos' || tab === 'semis' || tab === 'final') {
    renderAllKO();
  }
  window.scrollTo(0, 0);
});

// ============= RESET =============
function resetAll() {
  if (!confirm('¿Borrar todos los pronósticos?')) return;
  state.scores = {};
  state.ko = {};
  state.third = {};
  saveState();
  renderGroups();
  renderAllKO();
}

// ============= INIT =============
(async function init() {
  await loadState();
  renderCronograma();
  renderGroups();
  renderAllKO();
})();
</script>
</body>
</html>
